[package]
name = "pasteur-model"
description = "ONNX model loading and scoring for Pasteur evaluations"
readme = "README.md"
keywords = ["clinical-ai", "onnx", "inference", "evaluation"]
categories = ["science"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
pasteur-core = { workspace = true }
polars = { version = "0.54.4", default-features = false, features = ["lazy", "dtype-full", "strings", "csv"] }
ort = { version = "2.0.0-rc.12", default-features = false, features = ["std", "download-binaries", "tls-rustls"] }
serde = { workspace = true }
serde_json = { workspace = true }
