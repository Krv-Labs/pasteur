name: Release Pasteur

on:
  push:
    tags:
      - 'v*'
  # Manual runs build everything and dry-run the npm publish. PyPI, crates.io
  # and the GitHub Release only run on a tag push.
  workflow_dispatch:
    inputs:
      dry_run:
        description: Pass --dry-run to npm publish
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate tag and changelog
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version="$(awk -F'"' '/^version = "/ { print $2; exit }' Cargo.toml)"
          test "${GITHUB_REF_NAME}" = "v${version}"
          grep -Fx "## ${version}" CHANGELOG.md
      - name: Validate plugin version
        shell: bash
        run: |
          version="$(awk -F'"' '/^version = "/ { print $2; exit }' Cargo.toml)"
          test "$(jq -r .version plugin/.claude-plugin/plugin.json)" = "${version}"

  wheels:
    needs: validate
    name: wheel ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64 }
          - { os: ubuntu-24.04-arm, target: aarch64 }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: windows-latest, target: x64 }
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: bindings/python-bindings
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: auto
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: bindings/python-bindings/dist/*.whl

  sdist:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: bindings/python-bindings
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: bindings/python-bindings/dist/*.tar.gz

  pypi:
    needs: [wheels, sdist]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # PyPI Trusted Publishing: register this repo/workflow/environment as a
    # publisher for `pypasteur` on pypi.org. No token is stored.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  crates:
    needs: validate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Token auth because crates.io Trusted Publishing needs the crates
      # to exist first; switch to rust-lang/crates-io-auth-action after v0.3.0.
      - run: cargo publish --workspace --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  cli:
    needs: validate
    name: cli ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Native runners only. Linux builds on 22.04 so the binary runs on
        # glibc >= 2.35 rather than the newest runner's glibc.
        include:
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked -p pasteur-cli
      - name: Archive
        shell: bash
        run: |
          mkdir stage
          cp LICENSE stage/
          if [ "${{ runner.os }}" = Windows ]; then
            cp target/release/pasteur-cli.exe stage/
            (cd stage && 7z a ../pasteur-cli-${{ matrix.target }}.zip .)
          else
            cp target/release/pasteur-cli stage/
            tar -czf pasteur-cli-${{ matrix.target }}.tar.gz -C stage .
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: pasteur-cli-${{ matrix.target }}.*
          if-no-files-found: error

  npm:
    needs: [validate, cli]
    runs-on: ubuntu-latest
    # npm Trusted Publishing (OIDC): register this repo + release.yml as a
    # trusted publisher on each @krv-labs/pasteur* package. NPM_TOKEN is only
    # for the first publish, before the packages exist to configure.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm >= 11.5.1.
      - run: npm install -g npm@^11.5.1
      - uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          path: archives
          merge-multiple: true
      - name: Unpack archives as binaries/<target>/pasteur-cli
        shell: bash
        run: |
          for a in archives/*; do
            t="$(basename "$a")"; t="${t#pasteur-cli-}"; t="${t%.tar.gz}"; t="${t%.zip}"
            mkdir -p "binaries/$t"
            case "$a" in
              *.zip) unzip -q "$a" -d "binaries/$t" ;;
              *) tar -xzf "$a" -C "binaries/$t" ;;
            esac
          done
      - run: node npm/scripts/build-packages.mjs --binaries binaries --out dist --require-all
      - name: Publish (platform packages first, then the launcher)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # A real publish needs a tag ref (validate checked it against Cargo.toml).
          DRY: ${{ github.event_name != 'push' && (inputs.dry_run || !startsWith(github.ref, 'refs/tags/v')) && '--dry-run' || '' }}
        run: |
          for d in dist/pasteur-*; do (cd "$d" && npm publish --provenance --access public $DRY); done
          (cd dist/pasteur && npm publish --provenance --access public $DRY)

  github-release:
    needs: [wheels, sdist, cli, pypi, crates]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            $0 == "## " ver {keep=1; print; next}
            keep && /^## / {exit}
            keep {print}
          ' CHANGELOG.md > /tmp/release-notes.md
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file /tmp/release-notes.md \
            --generate-notes \
            dist/*
