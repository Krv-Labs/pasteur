[package]
name = "pasteur-cli"
description = "Local CLI for Pasteur: simulate data shifts, score ONNX models, compare, and render dataset cards"
readme = "README.md"
keywords = ["clinical-ai", "robustness", "onnx", "cli", "evaluation"]
categories = ["command-line-utilities", "science"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
name = "pasteur_cli"
path = "src/lib.rs"

[[bin]]
name = "pasteur-cli"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.103"
clap = { version = "4.6.1", features = ["derive"] }
pasteur-core = { workspace = true }
pasteur-hf = { workspace = true }
pasteur-model = { workspace = true }
polars = { version = "0.54.4", default-features = false, features = ["lazy", "serde", "random", "parquet", "dtype-full", "strings", "csv"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
polars = { version = "0.54.4", default-features = false, features = ["parquet", "dtype-full", "strings"] }
